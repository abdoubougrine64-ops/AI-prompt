<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI_Prompt1337</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            overflow: hidden;
        }

        /* Snap scrolling container */
        .reels-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        /* Individual reel card */
        .reel-card {
            height: 100vh;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            position: relative;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* YouTube Iframe styling */
        .reel-card iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Elevated overlay box */
        .overlay {
            position: absolute;
            bottom: 80px; /* Raised higher up */
            left: 15px;
            right: 15px;
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .prompt-header {
            font-size: 0.85rem;
            color: #c084fc;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .prompt-text {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #e5e7eb;
            max-height: 70px;
            overflow-y: auto;
            text-align: left;
        }

        /* Copy Button Styling */
        .copy-btn {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .copy-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .copy-btn.copied {
            background: #22c55e;
            border-color: #22c55e;
            color: #fff;
        }

        /* Affiliate Button */
        .affiliate-btn {
            display: block;
            text-align: center;
            background: linear-gradient(135deg, #7c3aed, #c026d3);
            color: #fff;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(124, 58, 237, 0.4);
        }

        .affiliate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(192, 38, 211, 0.6);
        }

        /* Loading indicator */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="reels-container" id="reelsContainer">
        <div class="loading" id="loading">Loading videos...</div>
    </div>

    <script>
        // Extract YouTube ID from various URL formats
        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Fetch JSON and build the UI
        async function loadReels() {
            const container = document.getElementById('reelsContainer');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('videos.json');
                if (!response.ok) throw new Error('Failed to load JSON file');

                const videosData = await response.json();
                
                loading.remove();

                if (videosData.length === 0) {
                    container.innerHTML = '<div class="loading">No videos found.</div>';
                    return;
                }

                videosData.forEach(item => {
                    const videoId = getYouTubeId(item.video_url);
                    if (!videoId) return;

                    const reelCard = document.createElement('div');
                    reelCard.className = 'reel-card';

                    const embedUrl = `https://www.youtube.com/embed/${videoId}?loop=1&playlist=${videoId}&modestbranding=1&rel=0`;

                    reelCard.innerHTML = `
                        <iframe src="${embedUrl}" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        
                        <div class="overlay">
                            <div class="prompt-header">
                                <span>✨ AI Prompt</span>
                                <button class="copy-btn">📋 Copy</button>
                            </div>
                            <div class="prompt-text">${item.prompt}</div>
                            <a href="${item.affiliate_url}" target="_blank" rel="noopener noreferrer" class="affiliate-btn">
                                🚀 Create with Lumina AI
                            </a>
                        </div>
                    `;

                    container.appendChild(reelCard);
                });

            } catch (error) {
                console.error(error);
                loading.textContent = 'Error loading videos. Make sure to run on a local server.';
            }
        }

        // Global Copy Prompt Listener
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('copy-btn') || e.target.closest('.copy-btn')) {
                const btn = e.target.classList.contains('copy-btn') ? e.target : e.target.closest('.copy-btn');
                const promptText = btn.closest('.overlay').querySelector('.prompt-text').innerText;

                navigator.clipboard.writeText(promptText).then(() => {
                    const originalHTML = btn.innerHTML;
                    btn.innerHTML = '✅ Copied!';
                    btn.classList.add('copied');

                    setTimeout(() => {
                        btn.innerHTML = originalHTML;
                        btn.classList.remove('copied');
                    }, 2000);
                }).catch(err => {
                    console.error('Failed to copy: ', err);
                });
            }
        });

        // Initialize
        loadReels();
    </script>

<body>

    <div class="reels-container" id="reelsContainer">
        <div class="loading" id="loading">جاري تحميل الفيديوهات...</div>
    </div>

    <script>
        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|shorts\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // دالة نسخ الرابط المباشر للفيديو
        function copyVideoLink(videoId) {
            const directUrl = `${window.location.origin}${window.location.pathname}#${videoId}`;
            navigator.clipboard.writeText(directUrl).then(() => {
                alert('✅ تم نسخ رابط الفيديو المباشر إلى الحافظة!');
            }).catch(() => {
                alert('حدث خطأ أثناء نسخ الرابط.');
            });
        }

        async function loadReels() {
            const container = document.getElementById('reelsContainer');
            const loading = document.getElementById('loading');

            try {
                const response = await fetch('videos.json');
                if (!response.ok) throw new Error('فشل في تحميل ملف JSON');

                const videosData = await response.json();
                loading.remove();

                if (videosData.length === 0) {
                    container.innerHTML = '<div class="loading">لا توجد فيديوهات للعرض</div>';
                    return;
                }

                videosData.forEach(item => {
                    const videoId = getYouTubeId(item.video_url);
                    if (!videoId) return;

                    const reelCard = document.createElement('div');
                    reelCard.className = 'reel-card';
                    reelCard.id = videoId; // تعيين المعرف الفريد للفيديو (ID)

                    const embedUrl = `https://www.youtube.com/embed/${videoId}?loop=1&playlist=${videoId}&modestbranding=1&rel=0`;

                    reelCard.innerHTML = `
                        <iframe src="${embedUrl}" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                        
                        <div class="overlay">
                            <div class="prompt-header">✨ البرومبت المستخدم:</div>
                            <div class="prompt-text">${item.prompt}</div>
                            
                            <div class="buttons-group">
                                <a href="${item.affiliate_url}" target="_blank" rel="noopener noreferrer" class="affiliate-btn">
                                    🚀 تجربة Lumina AI
                                </a>
                                <button onclick="copyVideoLink('${videoId}')" class="share-btn">
                                    🔗 مشاركة
                                </button>
                            </div>
                        </div>
                    `;

                    container.appendChild(reelCard);
                });

                // 1️⃣ التحقق مما إذا كان هناك هاش (#) في الرابط عند فتح الصفحة للانتقال إليه مباشرة
                const initialHash = window.location.hash;
                if (initialHash) {
                    const targetVideo = document.querySelector(initialHash);
                    if (targetVideo) {
                        setTimeout(() => {
                            targetVideo.scrollIntoView({ behavior: 'smooth' });
                        }, 300);
                    }
                }

                // 2️⃣ إعداد مراقب التمرير (IntersectionObserver) لتحديث رابط المتصفح تلقائياً
                setupScrollObserver();

            } catch (error) {
                console.error(error);
                loading.textContent = 'حدث خطأ أثناء تحميل الملف. يُرجى تشغيل الصفحة عبر سيرفر محلي (Live Server).';
            }
        }

        function setupScrollObserver() {
            const container = document.getElementById('reelsContainer');
            
            const observerOptions = {
                root: container,
                threshold: 0.6 // يعتبر الفيديو معروضاً إذا كان ظاهراً بنسبة 60% أو أكثر
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const videoId = entry.target.id;
                        // تحديث رابط المتصفح بدون إعادة تحميل الصفحة أو التأثير على التمرير
                        history.replaceState(null, null, `#${videoId}`);
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.reel-card').forEach(card => observer.observe(card));
        }

        loadReels();
    </script>
</body>
</html>
